<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>

  <!-- Fallback 1: works even if JavaScript is disabled -->
  <meta http-equiv="refresh" content="0; url=https://www.facebook.com/">

  <!-- Main redirect -->
  <script>
    window.location.replace("https://www.facebook.com/");
  </script>
</head>
<body>
  <!-- Fallback 2: manual link if both above fail -->
  <p>Redirecting... <a href="https://www.facebook.com/">Click here</a> if nothing happens.</p>
</body>
</html>
